name: Test Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Strip local proxy from nuget.config (CI runners have direct internet).
      - name: Strip local proxy from nuget.config
        shell: pwsh
        run: |
          $xml = [xml](Get-Content nuget.config)
          if ($xml.configuration.config) { $xml.configuration.config.RemoveAll() }
          $xml.Save("nuget.config")

      - name: Restore NuGet packages
        run: nuget restore FreeControl.sln

      - name: Build
        run: msbuild FreeControl.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="output"
