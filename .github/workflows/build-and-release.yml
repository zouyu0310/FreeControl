name: Build and Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # nuget.config contains a local proxy (127.0.0.1:7897) for the developer's machine.
      # GitHub-hosted runners have no such proxy; keep the file clean for CI.
      - name: Strip local proxy from nuget.config
        shell: pwsh
        run: |
          $xml = [xml](Get-Content nuget.config)
          if ($xml.configuration.config) { $xml.configuration.config.RemoveAll() }
          $xml.Save("nuget.config")

      - name: Restore NuGet packages
        run: nuget restore FreeControl.sln

      # Costura.Fody embeds all dependencies into a single FreeControl.exe at build time.
      - name: Build single-file exe
        shell: pwsh
        run: |
          msbuild FreeControl.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath="../output"
          $exe = "output/FreeControl.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          $sha = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          "sha256: $sha" | Out-File -FilePath "output/SHA256.txt" -Encoding utf8

      - name: Upload exe as draft release
        uses: softprops/action-gh-release@v2
        with:
          body_path: output/SHA256.txt
          files: output/FreeControl.exe
          name: ${{ github.ref_name }}
          draft: true
